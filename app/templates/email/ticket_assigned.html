<!DOCTYPE html>
<html>
<body style="
    font-family:Arial;
    background:#f5f7fa;
    padding:30px;
">

    <div style="
    background:white;
    padding:35px;
    border-radius:12px;
    max-width:650px;
    margin:auto;
">

        <h2 style="color:#10b981;">
            Ticket Assigned
        </h2>

        <p>Hello {{ user.name }},</p>

        <p>
            Your support ticket is now being handled by one of our agents.
        </p>

        <hr>

        <p>
            <strong>Ticket Number:</strong><br>
            {{ ticket.number }}
        </p>

        <p>
            <strong>Assigned Agent:</strong><br>
            {{ ticket.owner.name }}
        </p>

        <p>
            The assigned agent will contact you soon.
        </p>

    </div>

</body>
</html>
