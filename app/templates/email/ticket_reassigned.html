<!DOCTYPE html>
<html>
<body>

    <h2>Your Ticket Has Been Reassigned</h2>

    <p>Hello {{ user.name }},</p>

    <p>
        Your support ticket has been reassigned to another support agent.
    </p>

    <p>

        Ticket Number:
        {{ ticket.number }}

        <br>

        Subject:
        {{ ticket.subject }}

    </p>

    <a href="{{ url_for(
'customer.view_ticket',
id=ticket.id,
_external=True
) }}">
        View Ticket
    </a>

</body>
</html>
