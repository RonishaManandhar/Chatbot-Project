<!DOCTYPE html>
<html>
<body style="
    font-family:Arial;
    background:#f5f7fa;
    padding:30px;
">

    <div style="
    background:white;
    padding:35px;
    border-radius:12px;
    max-width:650px;
    margin:auto;
">

        <h2 style="color:#ef4444;">
            Ticket Closed
        </h2>

        <p>Hello {{ user.name }},</p>

        <p>
            Your support request has been resolved.
        </p>

        <hr>

        <p>
            <strong>Ticket Number:</strong><br>
            {{ ticket.number }}
        </p>

        <p>
            <strong>Subject:</strong><br>
            {{ ticket.subject }}
        </p>

        <p>
            If your issue still exists, you may reopen the ticket.
        </p>

    </div>

</body>
</html>
