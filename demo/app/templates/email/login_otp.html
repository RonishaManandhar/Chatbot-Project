<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>

<body style="
    background:#f4f6f9;
    font-family:Arial;
    padding:30px;
">

    <div style="
    max-width:600px;
    background:white;
    margin:auto;
    padding:35px;
    border-radius:12px;
">

        <h2 style="color:#2563eb;">
            Login Verification Code
        </h2>

        <p>Hello {{ user.name }},</p>

        <p>
            Use this code to complete login:
        </p>

        <div style="
        font-size:35px;
        font-weight:bold;
        letter-spacing:8px;
        text-align:center;
        padding:20px;
        background:#f3f4f6;
        border-radius:10px;
        margin:30px 0;
    ">
            {{ code }}
        </div>

        <p>
            This code expires in 10 minutes.
        </p>

        <p>
            If this was not you,
            change your password immediately.
        </p>

    </div>

</body>
</html>
