{% extends "layouts/auth.base.html" %}

{% block content %}

<div class="container"
     style="max-width:520px; margin-top:60px;">

    {% include "includes/alert.html" %}

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h3 class="mb-3">
                Login Verification
            </h3>

            <p class="text-muted">
                Enter the one-time login code sent to:
            </p>

            <p>
                <strong>{{ user.email }}</strong>
            </p>

            <form method="POST">

                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="loginCode">
                        One-Time Code
                    </label>

                    <input type="text"
                           id="loginCode"
                           name="code"
                           class="form-control form-control-lg text-center"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           pattern="[0-9]{6}"
                           maxlength="6"
                           placeholder="000000"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary btn-block">
                    Complete Login
                </button>

            </form>

            <form method="POST"
                  action="{{ url_for(
                      'auth.resend_login_otp'
                  ) }}"
                  class="mt-3">

                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token() }}">

                <button type="submit"
                        class="btn btn-link btn-block">
                    Resend Login Code
                </button>

            </form>

            <div class="text-center mt-2">
                <a href="{{ url_for('auth.login') }}">
                    Cancel and Return to Login
                </a>
            </div>

        </div>
    </div>

</div>

{% endblock %}
